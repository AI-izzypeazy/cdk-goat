[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "constructor-scout"
version = "0.1.0"
description = "Scan retail/ecommerce sites for product-discovery gaps Constructor.io can solve, and produce prospect briefs."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28",
    "beautifulsoup4>=4.11",
    "anthropic>=0.40",
]

[project.scripts]
constructor-scout = "constructor_scout.cli:main"

[tool.setuptools.packages.find]
include = ["constructor_scout*"]
